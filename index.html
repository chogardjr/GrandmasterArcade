<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body { background: #000; display: flex; flex-direction: column; align-items: center;
         justify-content: center; height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; }
  #gameCanvas { border: 2px solid #0f0; }
  #ui { color: #0f0; display: flex; justify-content: space-between; width: 320px; padding: 10px; font-size: 14px; }
  #controls { display: flex; justify-content: space-between; align-items: center;
              width: 320px; margin-top: 10px; }
  #moveBtns { display: flex; gap: 12px; }
  .btn { width: 70px; height: 50px; background: #222; border: 2px solid #0f0; color: #0f0;
         font-size: 20px; border-radius: 10px; user-select: none; display: flex;
         align-items: center; justify-content: center; }
  #fireBtn { width: 90px; }
  .btn:active { background: #0f0; color: #000; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: flex;
             flex-direction: column; align-items: center; justify-content: center; color: #0f0; gap: 15px; }
  .overlay h1 { font-size: 24px; text-align: center; }
  .overlay button { padding: 15px 30px; font-size: 18px; background: #0f0; color: #000;
                    border: none; cursor: pointer; font-family: inherit; font-weight: bold; }
  .overlay .menuBtn { width: 260px; padding: 18px; font-size: 16px; background: #111; color: #0f0;
                      border: 2px solid #0f0; }
  .overlay .menuBtn:active { background: #0f0; color: #000; }
  .overlay .secondary { background: #111; color: #0f0; border: 2px solid #0f0; font-size: 14px; padding: 10px 20px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="ui">
    <span>SCORE: <span id="score">0</span></span>
    <span id="midStat">LEVEL: <span id="level">1</span></span>
    <span id="livesStat">LIVES: <span id="lives">3</span></span>
  </div>
  <canvas id="gameCanvas" width="320" height="400"></canvas>
  <div id="controls">
    <div class="btn" id="fireBtn">🔥</div>
    <div id="moveBtns">
      <div class="btn" id="leftBtn">◀</div>
      <div class="btn" id="rightBtn">▶</div>
    </div>
  </div>

  <!-- Game select -->
  <div id="menuScreen" class="overlay">
    <h1>🕹️ ARCADE 🕹️</h1>
    <button class="menuBtn" data-game="invaders">👾 SPACE INVADERS</button>
    <button class="menuBtn" data-game="snake">🐍 SNAKE</button>
  </div>

  <!-- Per-game start -->
  <div id="startScreen" class="overlay hidden">
    <h1 id="startTitle">GAME</h1>
    <p id="startHint"></p>
    <button id="startBtn">START GAME</button>
    <button id="backBtn" class="secondary">← MENU</button>
  </div>

  <!-- Game over -->
  <div id="gameOverScreen" class="overlay hidden">
    <h1>GAME OVER</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <p id="extraLine">Level Reached: <span id="finalLevel">1</span></p>
    <button id="restartBtn">PLAY AGAIN</button>
    <button id="submitBtn">SUBMIT SCORE</button>
    <button id="menuBtn" class="secondary">MAIN MENU</button>
  </div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const $ = id => document.getElementById(id);
const canvas = $('gameCanvas');
const ctx = canvas.getContext('2d');

// Telegram is optional so the game still runs in a normal browser
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
const haptic = {
  tap:  () => tg?.HapticFeedback?.impactOccurred('light'),
  hurt: () => tg?.HapticFeedback?.notificationOccurred('error'),
  win:  () => tg?.HapticFeedback?.notificationOccurred('success'),
};

// Shared state
let current = null, currentKey = null, running = false, animationId = 0, lastT = 0;
let score = 0, lives = 3, level = 1;
const keys = { left: false, right: false, fire: false };

function updateHud() {
  $('score').textContent = score;
  $('level').textContent = level;
  $('lives').textContent = lives;
}
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }
function clearCanvas() { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); }

function endGame(levelReached) {
  if (!running) return;
  running = false;
  cancelAnimationFrame(animationId);
  Object.keys(keys).forEach(k => keys[k] = false);
  $('finalScore').textContent = score;
  $('extraLine').style.display = levelReached ? '' : 'none';
  if (levelReached) $('finalLevel').textContent = levelReached;
  show('gameOverScreen');
}

/* ================= SPACE INVADERS ================= */
const invadersGame = {
  title: '👾 SPACE INVADERS 👾',
  hint: 'Hold 🔥 to fire',
  showLevel: true, showLives: true, showFire: true,
  rows: 4, cols: 8,

  init() {
    this.ship = { x: 144, y: 360, w: 32, h: 24, speed: 3 };
    this.canFire = true;
    this.banner = 0;
    this.startLevel();
  },
  startLevel() {
    this.dir = 1;
    this.speed = 0.3 + Math.min(level - 1, 10) * 0.1;
    this.bullets = [];
    this.enemyBullets = [];
    const top = 40 + Math.min(level - 1, 5) * 8;
    this.aliens = [];
    for (let r = 0; r < this.rows; r++)
      for (let c = 0; c < this.cols; c++)
        this.aliens.push({ x: 30 + c * 35, y: top + r * 30, w: 24, h: 18, alive: true, type: r });
  },
  shootChance() { return Math.min(0.02 + (level - 1) * 0.004, 0.05); },
  shoot() {
    if (!running || !this.canFire || this.bullets.length >= 3) return;
    this.bullets.push({ x: this.ship.x + this.ship.w / 2, y: this.ship.y });
    this.canFire = false;
    setTimeout(() => { this.canFire = true; }, 300);
  },
  onButton(name) { if (name === 'fire') this.shoot(); },

  update() {
    const s = this.ship;
    if (keys.fire) this.shoot();
    if (keys.left && s.x > 0) s.x -= s.speed;
    if (keys.right && s.x < canvas.width - s.w) s.x += s.speed;

    this.bullets = this.bullets.filter(b => (b.y -= 5) > 0);
    this.enemyBullets = this.enemyBullets.filter(b => (b.y += 3) < canvas.height);

    let hitEdge = false;
    for (const a of this.aliens) {
      if (!a.alive) continue;
      a.x += this.dir * this.speed;
      if (a.x <= 5 || a.x >= canvas.width - a.w - 5) hitEdge = true;
      if (a.y + a.h >= s.y) { endGame(level); return; }
    }
    if (hitEdge) {
      this.dir *= -1;
      this.aliens.forEach(a => a.y += 15);
      this.speed += 0.05;
    }

    const alive = this.aliens.filter(a => a.alive);
    if (alive.length && Math.random() < this.shootChance()) {
      const a = alive[Math.floor(Math.random() * alive.length)];
      this.enemyBullets.push({ x: a.x + a.w / 2, y: a.y + a.h });
    }

    for (const b of this.bullets)
      for (const a of this.aliens)
        if (a.alive && b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
          a.alive = false; b.hit = true;
          score += (4 - a.type) * 10;
          updateHud();
          haptic.tap();
        }
    this.bullets = this.bullets.filter(b => !b.hit);

    if (this.aliens.every(a => !a.alive)) {
      level++;
      updateHud();
      this.startLevel();
      this.banner = 90;
      haptic.win();
      return;
    }

    for (const b of this.enemyBullets)
      if (b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
        b.hit = true;
        lives--;
        updateHud();
        haptic.hurt();
        if (lives <= 0) { endGame(level); return; }
      }
    this.enemyBullets = this.enemyBullets.filter(b => !b.hit);
  },

  draw() {
    const s = this.ship;
    ctx.fillStyle = '#0f0';
    ctx.fillRect(s.x + 12, s.y, 8, 12);
    ctx.fillRect(s.x + 4, s.y + 12, 24, 8);
    ctx.fillRect(s.x, s.y + 16, 4, 8);
    ctx.fillRect(s.x + 28, s.y + 16, 4, 8);

    const colors = ['#f0f', '#f00', '#ff0', '#0ff'];
    for (const a of this.aliens) {
      if (!a.alive) continue;
      ctx.fillStyle = colors[a.type];
      ctx.fillRect(a.x + 4, a.y, 16, 6);
      ctx.fillRect(a.x, a.y + 6, 24, 6);
      ctx.fillRect(a.x + 2, a.y + 12, 4, 6);
      ctx.fillRect(a.x + 18, a.y + 12, 4, 6);
    }
    ctx.fillStyle = '#0f0';
    this.bullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 10));
    ctx.fillStyle = '#f00';
    this.enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 8));

    if (this.banner > 0) {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL ' + level, canvas.width / 2, canvas.height / 2);
      this.banner--;
    }
  }
};

/* ================= SNAKE ================= */
const snakeGame = {
  title: '🐍 SNAKE',
  hint: 'Swipe, or use
