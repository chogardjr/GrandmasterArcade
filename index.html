<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body { background: #000; display: flex; flex-direction: column; align-items: center;
         justify-content: center; height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; }
  #gameCanvas { border: 2px solid #0f0; }
  #ui { color: #0f0; display: flex; justify-content: space-between; width: 320px; padding: 10px; font-size: 14px; }
  #controls { display: flex; justify-content: space-between; align-items: center; width: 320px; margin-top: 10px; }
  #moveBtns { display: flex; gap: 12px; }
  .btn { width: 70px; height: 50px; background: #222; border: 2px solid #0f0; color: #0f0; font-size: 20px;
         border-radius: 10px; user-select: none; display: flex; align-items: center; justify-content: center; }
  #fireBtn { width: 90px; }
  .btn:active { background: #0f0; color: #000; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
             align-items: center; justify-content: center; color: #0f0; gap: 15px; text-align: center; }
  .overlay h1 { font-size: 24px; }
  .overlay button { padding: 15px 30px; font-size: 18px; background: #0f0; color: #000; border: none;
                    cursor: pointer; font-family: inherit; font-weight: bold; }
  .overlay .alt { background: #111; color: #0f0; border: 2px solid #0f0; font-size: 16px; }
  .overlay .menuBtn { width: 260px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="ui">
    <span>SCORE: <span id="score">0</span></span>
    <span id="midStat">LEVEL: <span id="level">1</span></span>
    <span id="livesStat">LIVES: <span id="lives">3</span></span>
  </div>
  <canvas id="gameCanvas" width="320" height="400"></canvas>
  <div id="controls">
    <div class="btn" id="fireBtn">🔥</div>
    <div id="moveBtns">
      <div class="btn" id="leftBtn">◀</div>
      <div class="btn" id="rightBtn">▶</div>
    </div>
  </div>

  <div id="menuScreen" class="overlay">
    <h1>🕹️ ARCADE 🕹️</h1>
    <button class="alt menuBtn" data-game="invaders">👾 SPACE INVADERS</button>
    <button class="alt menuBtn" data-game="snake">🐍 SNAKE</button>
    <button class="alt menuBtn" data-game="breakout">🧱 BREAKOUT</button>
	<button class="alt menuBtn" data-game="pong">🏓 PONG</button>
  </div>

  <div id="startScreen" class="overlay hidden">
    <h1 id="startTitle">GAME</h1>
    <p id="startHint"></p>
    <button id="startBtn">START GAME</button>
    <button id="backBtn" class="alt">← MENU</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1>GAME OVER</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <p id="extraLine">Level Reached: <span id="finalLevel">1</span></p>
    <button id="restartBtn">PLAY AGAIN</button>
    <button id="submitBtn">SUBMIT SCORE</button>
    <button id="menuBtn" class="alt">MAIN MENU</button>
  </div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const $ = id => document.getElementById(id);
const canvas = $('gameCanvas'), ctx = canvas.getContext('2d');

// Telegram is optional, so the game also runs in a normal browser
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
function buzz(type, kind) { try { tg.HapticFeedback[type](kind); } catch (e) {} }

let current = null, currentKey = null, running = false, raf = 0, lastT = 0;
let score = 0, lives = 3, level = 1;
const keys = { left: false, right: false, fire: false };

const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
function updateHud() {
  $('score').textContent = score;
  $('level').textContent = level;
  $('lives').textContent = lives;
}

/* ============ SPACE INVADERS ============ */
const invaders = {
  title: '👾 SPACE INVADERS 👾', hint: 'Hold 🔥 to fire',
  showLevel: true, showLives: true, showFire: true,

  init() {
    this.ship = { x: 144, y: 360, w: 32, h: 24, speed: 3 };
    this.canFire = true;
    this.banner = 0;
    this.startLevel();
  },
  startLevel() {
    this.dir = 1;
    this.speed = 0.3 + Math.min(level - 1, 10) * 0.1;
    this.bullets = [];
    this.enemyBullets = [];
    this.aliens = [];
    const top = 40 + Math.min(level - 1, 5) * 8;
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 8; c++)
        this.aliens.push({ x: 30 + c * 35, y: top + r * 30, w: 24, h: 18, alive: true, type: r });
  },
  shoot() {
    if (!running || !this.canFire || this.bullets.length >= 3) return;
    this.bullets.push({ x: this.ship.x + this.ship.w / 2, y: this.ship.y });
    this.canFire = false;
    setTimeout(() => { this.canFire = true; }, 300);
  },
  onPress(name) { if (name === 'fire') this.shoot(); },

  update() {
    const s = this.ship;
    if (keys.fire) this.shoot();
    if (keys.left && s.x > 0) s.x -= s.speed;
    if (keys.right && s.x < canvas.width - s.w) s.x += s.speed;

    this.bullets = this.bullets.filter(b => (b.y -= 5) > 0);
    this.enemyBullets = this.enemyBullets.filter(b => (b.y += 3) < canvas.height);

    let hitEdge = false;
    for (const a of this.aliens) {
      if (!a.alive) continue;
      a.x += this.dir * this.speed;
      if (a.x <= 5 || a.x >= canvas.width - a.w - 5) hitEdge = true;
      if (a.y + a.h >= s.y) { endGame(level); return; }
    }
    if (hitEdge) {
      this.dir *= -1;
      this.aliens.forEach(a => { a.y += 15; });
      this.speed += 0.05;
    }

    const alive = this.aliens.filter(a => a.alive);
    const chance = Math.min(0.02 + (level - 1) * 0.004, 0.05);
    if (alive.length && Math.random() < chance) {
      const a = alive[Math.floor(Math.random() * alive.length)];
      this.enemyBullets.push({ x: a.x + a.w / 2, y: a.y + a.h });
    }

    for (const b of this.bullets)
      for (const a of this.aliens)
        if (a.alive && b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
          a.alive = false; b.hit = true;
          score += (4 - a.type) * 10;
          updateHud();
          buzz('impactOccurred', 'light');
        }
    this.bullets = this.bullets.filter(b => !b.hit);

    if (this.aliens.every(a => !a.alive)) {
      level++;
      updateHud();
      this.startLevel();
      this.banner = 90;
      buzz('notificationOccurred', 'success');
      return;
    }

    for (const b of this.enemyBullets)
      if (b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
        b.hit = true;
        lives--;
        updateHud();
        buzz('notificationOccurred', 'error');
        if (lives <= 0) { endGame(level); return; }
      }
    this.enemyBullets = this.enemyBullets.filter(b => !b.hit);
  },

  draw() {
    const s = this.ship;
    ctx.fillStyle = '#0f0';
    ctx.fillRect(s.x + 12, s.y, 8, 12);
    ctx.fillRect(s.x + 4, s.y + 12, 24, 8);
    ctx.fillRect(s.x, s.y + 16, 4, 8);
    ctx.fillRect(s.x + 28, s.y + 16, 4, 8);

    const colors = ['#f0f', '#f00', '#ff0', '#0ff'];
    for (const a of this.aliens) {
      if (!a.alive) continue;
      ctx.fillStyle = colors[a.type];
      ctx.fillRect(a.x + 4, a.y, 16, 6);
      ctx.fillRect(a.x, a.y + 6, 24, 6);
      ctx.fillRect(a.x + 2, a.y + 12, 4, 6);
      ctx.fillRect(a.x + 18, a.y + 12, 4, 6);
    }
    ctx.fillStyle = '#0f0';
    this.bullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 10));
    ctx.fillStyle = '#f00';
    this.enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 8));

    if (this.banner > 0) {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL ' + level, canvas.width / 2, canvas.height / 2);
      this.banner--;
    }
  }
};

/* ============ SNAKE ============ */
const CELL = 20, GW = 16, GH = 20;
const snake = {
  title: '🐍 SNAKE', hint: '◀ ▶ turn left / right. Swipes and arrow keys work too.',
  showLevel: false, showLives: false, showFire: false,

  init() {
    this.body = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    this.dir = { x: 1, y: 0 };
    this.queue = [];
    this.step = 140;
    this.acc = 0;
    this.food = this.placeFood();
  },
  placeFood() {
    let p;
    do { p = { x: Math.floor(Math.random() * GW), y: Math.floor(Math.random() * GH) }; }
    while (this.body.some(s => s.x === p.x && s.y === p.y));
    return p;
  },
  lastDir() { return this.queue.length ? this.queue[this.queue.length - 1] : this.dir; },
  push(d) { if (this.queue.length < 2) this.queue.push(d); },
  setDir(x, y) {
    const b = this.lastDir();
    if ((x === b.x && y === b.y) || (x === -b.x && y === -b.y)) return;
    this.push({ x, y });
  },
  onPress(name) {
    const b = this.lastDir();
    if (name === 'left') this.push({ x: b.y, y: -b.x });
    if (name === 'right') this.push({ x: -b.y, y: b.x });
  },

  update(dt) {
    this.acc += Math.min(dt, 100);
    while (this.acc >= this.step) {
      this.acc -= this.step;
      if (this.queue.length) this.dir = this.queue.shift();
      const head = {
        x: (this.body[0].x + this.dir.x + GW) % GW,
        y: (this.body[0].y + this.dir.y + GH) % GH
      };
      const ate = head.x === this.food.x && head.y === this.food.y;
      const solid = ate ? this.body : this.body.slice(0, -1);
      if (solid.some(s => s.x === head.x && s.y === head.y)) { endGame(0); return; }
      this.body.unshift(head);
      if (ate) {
        score += 10;
        updateHud();
        buzz('impactOccurred', 'light');
        this.step = Math.max(70, this.step - 2);
        this.food = this.placeFood();
      } else {
        this.body.pop();
      }
    }
  },

  draw() {
    ctx.strokeStyle = '#062a10';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GW; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, GH * CELL); ctx.stroke(); }
    for (let i = 0; i <= GH; i++) { ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(GW * CELL, i * CELL); ctx.stroke(); }
    ctx.fillStyle = '#f00';
    ctx.fillRect(this.food.x * CELL + 3, this.food.y * CELL + 3, CELL - 6, CELL - 6);
    this.body.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#0f0' : '#0a0';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }
};

/* ============ BREAKOUT ============ */
const B_STEP = 1000 / 60;   // fixed 60 ticks per second on any screen
const breakout = {
  title: '🧱 BREAKOUT', hint: 'Hold ◀ ▶ or drag your finger to move the paddle.',
  showLevel: true, showLives: true, showFire: false,
  R: 4, BW: 34, BH: 14, GAP: 3, COLS: 8, TOP: 50, X0: 13,
  colors: ['#ff3b3b', '#ff8c3b', '#ffd83b', '#3bff5a', '#3bdcff', '#3b82ff', '#d93bff'],

  init() {
    this.paddle = { x: 132, y: 380, w: 56, h: 8 };
    this.acc = 0;
    this.banner = 0;
    this.startLevel();
  },
  startLevel() {
    this.speed = Math.min(3.2 + (level - 1) * 0.3, 6);
    const rows = Math.min(3 + level, 7);
    this.bricks = [];
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < this.COLS; c++)
        this.bricks.push({
          x: this.X0 + c * (this.BW + this.GAP),
          y: this.TOP + r * (this.BH + this.GAP),
          row: r, alive: true
        });
    this.resetBall();
  },
  resetBall() {
    const p = this.paddle;
    this.bx = p.x + p.w / 2;
    this.by = p.y - this.R;
    this.vx = 0;
    this.vy = 0;
    this.serve = 45;   // short pause before the ball launches
  },
  launch() {
    const a = (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.35);
    this.vx = this.speed * Math.sin(a);
    this.vy = -this.speed * Math.cos(a);
  },
  setSpeed(s) {
    const m = Math.hypot(this.vx, this.vy) || 1;
    this.vx *= s / m;
    this.vy *= s / m;
  },

  update(dt) {
    this.acc += Math.min(dt, 100);
    while (this.acc >= B_STEP) {
      this.acc -= B_STEP;
      this.tick();
      if (!running) return;
    }
  },

  tick() {
    const p = this.paddle, R = this.R;
    if (keys.left) p.x -= 5;
    if (keys.right) p.x += 5;
    p.x = Math.max(0, Math.min(canvas.width - p.w, p.x));

    if (this.serve > 0) {
      this.bx = p.x + p.w / 2;
      this.by = p.y - R;
      this.serve--;
      if (this.serve === 0) this.launch();
      return;
    }

    this.bx += this.vx;
    this.by += this.vy;

    // walls and ceiling
    if (this.bx - R < 0) { this.bx = R; this.vx = Math.abs(this.vx); }
    if (this.bx + R > canvas.width) { this.bx = canvas.width - R; this.vx = -Math.abs(this.vx); }
    if (this.by - R < 0) { this.by = R; this.vy = Math.abs(this.vy); }

    // ball lost
    if (this.by - R > canvas.height) {
      lives--;
      updateHud();
      buzz('notificationOccurred', 'error');
      if (lives <= 0) { endGame(level); return; }
      this.resetBall();
      return;
    }

    // paddle: where the ball lands sets the bounce angle
    if (this.vy > 0 && this.by + R >= p.y && this.by - R <= p.y + p.h &&
        this.bx >= p.x - R && this.bx <= p.x + p.w + R) {
      const hit = Math.max(-1, Math.min(1, (this.bx - (p.x + p.w / 2)) / (p.w / 2)));
      const a = hit * 1.05;   // up to about 60 degrees from vertical
      this.vx = this.speed * Math.sin(a);
      this.vy = -this.speed * Math.cos(a);
      this.by = p.y - R;
    }

    // bricks: at most one per tick
    for (const b of this.bricks) {
      if (!b.alive) continue;
      const nx = Math.max(b.x, Math.min(this.bx, b.x + this.BW));
      const ny = Math.max(b.y, Math.min(this.by, b.y + this.BH));
      if ((this.bx - nx) ** 2 + (this.by - ny) ** 2 > R * R) continue;
      b.alive = false;
      const ox = Math.min(this.bx + R - b.x, b.x + this.BW - (this.bx - R));
      const oy = Math.min(this.by + R - b.y, b.y + this.BH - (this.by - R));
      if (ox < oy) this.vx = -this.vx; else this.vy = -this.vy;
      score += (7 - b.row) * 10;
      updateHud();
      buzz('impactOccurred', 'light');
      this.speed = Math.min(this.speed + 0.03, 7);
      this.setSpeed(this.speed);
      break;
    }

    // level cleared
    if (this.bricks.every(b => !b.alive)) {
      level++;
      updateHud();
      this.startLevel();
      this.banner = 90;
      buzz('notificationOccurred', 'success');
    }
  },

  draw() {
    for (const b of this.bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = this.colors[b.row];
      ctx.fillRect(b.x, b.y, this.BW, this.BH);
    }
    const p = this.paddle;
    ctx.fillStyle = '#0f0';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.bx, this.by, this.R, 0, Math.PI * 2);
    ctx.fill();

    if (this.banner > 0) {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL ' + level, canvas.width / 2, canvas.height / 2 + 60);
      this.banner--;
    }
  }
};

/* ============ PONG ============ */
const pong = {
  title: '🏓 PONG', hint: 'Beat the CPU paddle. Hold ◀ ▶ or drag your finger.',
  showLevel: true, showLives: true, showFire: false,
  R: 5, WIN: 5,   // ball radius, points needed to clear a level

  init() {
    this.paddle = { x: 132, y: 380, w: 56, h: 8 };
    this.cpu = { x: 132, y: 12, w: 56, h: 8 };
    this.acc = 0;
    this.banner = 0;
    this.lvlPoints = 0;
    this.aim = 0;
    this.setLevel();
    this.serveBall(1);
  },
  setLevel() {
    this.base = Math.min(3.2 + (level - 1) * 0.35, 6);
    this.cpuSpeed = Math.min(1.8 + (level - 1) * 0.35, 4.6);
  },
  serveBall(dir) {
    this.bx = canvas.width / 2;
    this.by = canvas.height / 2;
    this.vx = 0;
    this.vy = 0;
    this.speed = this.base;
    this.serveDir = dir;   // 1 = toward you, -1 = toward the CPU
    this.serve = 45;       // short pause before the ball launches
  },
  launch() {
    const a = (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.4);
    this.vx = this.speed * Math.sin(a);
    this.vy = this.serveDir * this.speed * Math.cos(a);
  },

  update(dt) {
    this.acc += Math.min(dt, 100);
    while (this.acc >= B_STEP) {
      this.acc -= B_STEP;
      this.tick();
      if (!running) return;
    }
  },

  tick() {
    const p = this.paddle, c = this.cpu, R = this.R;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    // your paddle
    if (keys.left) p.x -= 5;
    if (keys.right) p.x += 5;
    p.x = clamp(p.x, 0, canvas.width - p.w);

    // CPU paddle: chases the ball with a capped speed and a small aiming error
    const target = (this.vy < 0 ? this.bx - this.aim : canvas.width / 2) - c.w / 2;
    c.x += clamp(target - c.x, -this.cpuSpeed, this.cpuSpeed);
    c.x = clamp(c.x, 0, canvas.width - c.w);

    if (this.serve > 0) {
      this.serve--;
      if (this.serve === 0) this.launch();
      return;
    }

    this.bx += this.vx;
    this.by += this.vy;

    // side walls
    if (this.bx - R < 0) { this.bx = R; this.vx = Math.abs(this.vx); }
    if (this.bx + R > canvas.width) { this.bx = canvas.width - R; this.vx = -Math.abs(this.vx); }

    // your paddle: where the ball lands sets the bounce angle
    if (this.vy > 0 && this.by + R >= p.y && this.by - R <= p.y + p.h &&
        this.bx >= p.x - R && this.bx <= p.x + p.w + R) {
      const hit = clamp((this.bx - (p.x + p.w / 2)) / (p.w / 2), -1, 1);
      const a = hit * 1.05;
      this.speed = Math.min(this.speed + 0.15, this.base + 2);
      this.vx = this.speed * Math.sin(a);
      this.vy = -this.speed * Math.cos(a);
      this.by = p.y - R;
      this.aim = (Math.random() * 2 - 1) * c.w * 0.4;   // new CPU aiming error
      buzz('impactOccurred', 'light');
    }

    // CPU paddle
    if (this.vy < 0 && this.by - R <= c.y + c.h && this.by + R >= c.y &&
        this.bx >= c.x - R && this.bx <= c.x + c.w + R) {
      const hit = clamp((this.bx - (c.x + c.w / 2)) / (c.w / 2), -1, 1);
      const a = hit * 1.05;
      this.vx = this.speed * Math.sin(a);
      this.vy = this.speed * Math.cos(a);
      this.by = c.y + c.h + R;
    }

    // ball got past you: lose a life
    if (this.by - R > canvas.height) {
      lives--;
      updateHud();
      buzz('notificationOccurred', 'error');
      if (lives <= 0) { endGame(level); return; }
      this.serveBall(-1);
      return;
    }

    // ball got past the CPU: you score
    if (this.by + R < 0) {
      score += 10 * level;
      this.lvlPoints++;
      if (this.lvlPoints >= this.WIN) {
        level++;
        this.lvlPoints = 0;
        this.setLevel();
        this.banner = 90;
        buzz('notificationOccurred', 'success');
      }
      updateHud();
      this.serveBall(1);
    }
  },

  draw() {
    // center line
    ctx.fillStyle = '#063a14';
    for (let x = 0; x < canvas.width; x += 20) ctx.fillRect(x, canvas.height / 2 - 1, 10, 2);

    const p = this.paddle, c = this.cpu;
    ctx.fillStyle = '#0f0';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#f33';
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.bx, this.by, this.R, 0, Math.PI * 2);
    ctx.fill();

    // points toward the next level
    ctx.fillStyle = '#0a0';
    ctx.font = '14px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(this.lvlPoints + ' / ' + this.WIN, 8, canvas.height / 2 - 8);

    if (this.banner > 0) {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL ' + level, canvas.width / 2, canvas.height / 2 + 60);
      this.banner--;
    }
  }
};
 
/* ============ SHARED GAME FLOW ============ */
const GAMES = { invaders, snake, breakout, pong };

function openGame(key) {
  currentKey = key;
  current = GAMES[key];
  $('startTitle').textContent = current.title;
  $('startHint').textContent = current.hint;
  hide('menuScreen'); hide('gameOverScreen');
  show('startScreen');
}

function startGame() {
  score = 0; lives = 3; level = 1;
  $('midStat').style.visibility = current.showLevel ? 'visible' : 'hidden';
  $('livesStat').style.visibility = current.showLives ? 'visible' : 'hidden';
  $('fireBtn').style.visibility = current.showFire ? 'visible' : 'hidden';
  Object.keys(keys).forEach(k => { keys[k] = false; });
  hide('startScreen'); hide('gameOverScreen');
  current.init();
  updateHud();
  running = true;
  lastT = performance.now();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function loop(t) {
  if (!running) return;
  const dt = t - lastT;
  lastT = t;
  current.update(dt);
  if (!running) return;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  current.draw();
  raf = requestAnimationFrame(loop);
}

function endGame(levelReached) {
  if (!running) return;
  running = false;
  cancelAnimationFrame(raf);
  Object.keys(keys).forEach(k => { keys[k] = false; });
  $('finalScore').textContent = score;
  $('extraLine').style.display = levelReached ? '' : 'none';
  if (levelReached) $('finalLevel').textContent = levelReached;
  show('gameOverScreen');
}

function toMenu() {
  running = false;
  cancelAnimationFrame(raf);
  hide('startScreen'); hide('gameOverScreen');
  show('menuScreen');
}

/* ============ INPUT ============ */
function bindButton(id, name) {
  const el = $(id);
  const on = e => { e.preventDefault(); keys[name] = true; if (running && current.onPress) current.onPress(name); };
  const off = e => { e.preventDefault(); keys[name] = false; };
  el.addEventListener('touchstart', on);
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindButton('leftBtn', 'left');
bindButton('rightBtn', 'right');
bindButton('fireBtn', 'fire');

document.addEventListener('keydown', e => {
  if (!running) return;
  if (e.key === 'ArrowLeft') { keys.left = true; if (current === snake) snake.setDir(-1, 0); }
  if (e.key === 'ArrowRight') { keys.right = true; if (current === snake) snake.setDir(1, 0); }
  if (e.key === 'ArrowUp') { if (current === snake) snake.setDir(0, -1); else keys.fire = true; e.preventDefault(); }
  if (e.key === 'ArrowDown') { if (current === snake) snake.setDir(0, 1); e.preventDefault(); }
  if (e.key === ' ') { keys.fire = true; e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === ' ' || e.key === 'ArrowUp') keys.fire = false;
});

// Swipes for Snake
let tx = 0, ty = 0;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
canvas.addEventListener('touchend', e => {
  if (!running || current !== snake) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) snake.setDir(dx > 0 ? 1 : -1, 0);
  else snake.setDir(0, dy > 0 ? 1 : -1);
});

// Drag a finger to move the paddle (Breakout and Pong)
function dragPaddle(e) {
  if (!running || (current !== breakout && current !== pong)) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const x = (e.touches[0].clientX - r.left - canvas.clientLeft) * canvas.width / canvas.clientWidth;
  const p = current.paddle;
  p.x = Math.max(0, Math.min(canvas.width - p.w, x - p.w / 2));
}
canvas.addEventListener('touchstart', dragPaddle, { passive: false });
canvas.addEventListener('touchmove', dragPaddle, { passive: false });
 
/* ============ MENU BUTTONS ============ */
document.querySelectorAll('.menuBtn').forEach(b => { b.onclick = () => openGame(b.dataset.game); });
$('startBtn').onclick = startGame;
$('restartBtn').onclick = startGame;
$('backBtn').onclick = toMenu;
$('menuBtn').onclick = toMenu;
// sendData closes the Mini App, so it only runs on an explicit tap
$('submitBtn').onclick = () => {
  const payload = JSON.stringify({ game: currentKey, score, level });
  if (tg) tg.sendData(payload); else alert('Open from Telegram to submit: ' + payload);
};
 // Jump straight into a game when the URL has ?game=name
const wanted = new URLSearchParams(location.search).get('game');
if (wanted && GAMES[wanted]) openGame(wanted);
</script>
</body>
</html>
