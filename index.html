<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta property="og:image" content="https://chogardjr.github.io/GrandmasterArcade/grandmaster-arcade-banner.png">
<meta property="og:title" content="Grandmaster Arcade">
<meta property="og:description" content="Classic arcade games in Telegram">
<title>Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body { background: #000; display: flex; flex-direction: column; align-items: center;
         justify-content: center; height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; }
  #gameCanvas { border: 2px solid #0f0; }
  #ui { color: #0f0; display: flex; justify-content: space-between; width: 320px; padding: 10px; font-size: 14px; }
  #controls { display: flex; justify-content: space-between; align-items: center; width: 320px; margin-top: 10px; }
  #moveBtns { display: flex; gap: 12px; }
  .btn { width: 70px; height: 50px; background: #222; border: 2px solid #0f0; color: #0f0; font-size: 20px;
         border-radius: 10px; user-select: none; display: flex; align-items: center; justify-content: center; }
  #fireBtn { width: 90px; }
#collapseBtn {
  position: fixed;
  right: 0;
  bottom: 0;
  width: 32px;
  height: 32px;
  background: #222;
  border: 2px solid #0f0;
  border-right: none;
  border-bottom: none;
  border-radius: 10px 0 0 0;
  color: #0f0;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
#collapseBtn:active { background: #0f0; color: #000; }
#collapseBtn.collapsed::after { content: '▲'; }
#collapseBtn:not(.collapsed)::after { content: '▼'; }

  .btn:active { background: #0f0; color: #000; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
             align-items: center; justify-content: center; color: #0f0; gap: 15px; text-align: center; }
  .overlay h1 { font-size: 24px; }
  .overlay button { padding: 15px 30px; font-size: 18px; background: #0f0; color: #000; border: none;
                    cursor: pointer; font-family: inherit; font-weight: bold; }
  .overlay .alt { background: #111; color: #0f0; border: 2px solid #0f0; font-size: 16px; }
  .overlay .menuBtn { width: 260px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="ui">
    <span>SCORE: <span id="score">0</span></span>
    <span id="midStat">LEVEL: <span id="level">1</span></span>
    <span id="livesStat">LIVES: <span id="lives">3</span></span>
  </div>
  <canvas id="gameCanvas" width="320" height="400"></canvas>
  <div id="collapseBtn"></div>
  <div id="controls">
    <div class="btn" id="fireBtn">🔥</div>
    <div id="moveBtns">
      <div class="btn" id="leftBtn">◀</div>
      <div class="btn" id="rightBtn">▶</div>
    </div>
  </div>

  <div id="menuScreen" class="overlay">
    <h1>🕹️ ARCADE 🕹️</h1>
    <button class="alt menuBtn" data-game="invaders">👾 SPACE INVADERS</button>
    <button class="alt menuBtn" data-game="snake">🐍 SNAKE</button>
    <button class="alt menuBtn" data-game="breakout">🧱 BREAKOUT</button>
	<button class="alt menuBtn" data-game="pong">🏓 PONG</button>
	<button class="alt menuBtn" data-game="galaga">👾 GALAGA</button>
  </div>

  <div id="startScreen" class="overlay hidden">
    <h1 id="startTitle">GAME</h1>
    <p id="startHint"></p>
    <button id="startBtn">START GAME</button>
    <button id="backBtn" class="alt">← MENU</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1>GAME OVER</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <p id="extraLine">Level Reached: <span id="finalLevel">1</span></p>
    <button id="restartBtn">PLAY AGAIN</button>
    <button id="submitBtn">SUBMIT SCORE</button>
    <button id="menuBtn" class="alt">MAIN MENU</button>
  </div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const $ = id => document.getElementById(id);
const canvas = $('gameCanvas'), ctx = canvas.getContext('2d');

// Telegram is optional, so the game also runs in a normal browser
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
if (tg && tg.disableVerticalSwipes) tg.disableVerticalSwipes();
function buzz(type, kind) { try { tg.HapticFeedback[type](kind); } catch (e) {} }

let current = null, currentKey = null, running = false, raf = 0, lastT = 0;
let score = 0, lives = 3, level = 1;
const MAX_LIVES = 3;   // most lives a player can hold
let bannerMsg = "";   // message to show on the banner
const keys = { left: false, right: false, fire: false };

const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
function updateHud() {
  $('score').textContent = score;
  $('level').textContent = level;
  $('lives').textContent = lives;
}

/* ============ SPACE INVADERS ============ */
const invaders = {
  title: '👾 SPACE INVADERS 👾', hint: 'Hold 🔥 to fire',
  showLevel: true, showLives: true, showFire: true,

  STEP: 1000 / 60,  // fixed 60fps logic rate
  acc: 0,
  init() {
    this.ship = { x: 144, y: 360, w: 32, h: 24, speed: 3 };
    this.canFire = true;
    this.banner = 0;
    this.startLevel();
  },
  startLevel() {
    this.dir = 1;
    this.speed = 0.3 + Math.min(level - 1, 10) * 0.1;
    this.bullets = [];
    this.enemyBullets = [];
    this.aliens = [];
    const top = 40 + Math.min(level - 1, 5) * 8;
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 8; c++)
        this.aliens.push({ x: 30 + c * 35, y: top + r * 30, w: 24, h: 18, alive: true, type: r });
  },
  shoot() {
    if (!running || !this.canFire || this.bullets.length >= 3) return;
    this.bullets.push({ x: this.ship.x + this.ship.w / 2, y: this.ship.y });
    this.canFire = false;
    setTimeout(() => { this.canFire = true; }, 300);
  },
  onPress(name) { if (name === 'fire') this.shoot(); },

  update(dt) {
    this.acc += Math.min(dt, 100);
    while (this.acc >= this.STEP) {
      this.acc -= this.STEP;
      this.tick();
      if (!running) return;
    }
  },
  
  tick() {
    const s = this.ship;
    if (keys.fire) this.shoot();
    if (keys.left && s.x > 0) s.x -= s.speed;
    if (keys.right && s.x < canvas.width - s.w) s.x += s.speed;

    this.bullets = this.bullets.filter(b => (b.y -= 5) > 0);
    this.enemyBullets = this.enemyBullets.filter(b => (b.y += 3) < canvas.height);

    let hitEdge = false;
    for (const a of this.aliens) {
      if (!a.alive) continue;
      a.x += this.dir * this.speed;
      if (a.x <= 5 || a.x >= canvas.width - a.w - 5) hitEdge = true;
      if (a.y + a.h >= s.y) { endGame(level); return; }
    }
    if (hitEdge) {
      this.dir *= -1;
      this.aliens.forEach(a => { a.y += 15; });
      this.speed += 0.05;
    }

    const alive = this.aliens.filter(a => a.alive);
    const chance = Math.min(0.02 + (level - 1) * 0.004, 0.05);
    if (alive.length && Math.random() < chance) {
      const a = alive[Math.floor(Math.random() * alive.length)];
      this.enemyBullets.push({ x: a.x + a.w / 2, y: a.y + a.h });
    }

    for (const b of this.bullets)
      for (const a of this.aliens)
        if (a.alive && b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
          a.alive = false; b.hit = true;
          score += (4 - a.type) * 10;
          updateHud();
          buzz('impactOccurred', 'light');
        }
    this.bullets = this.bullets.filter(b => !b.hit);

    if (this.aliens.every(a => !a.alive)) {
      score += 100 * level;   // level-clear bonus
      level++;
      if (lives < MAX_LIVES) { lives++; bannerMsg = "+1 LIFE"; }
      updateHud();
      this.startLevel();
      this.banner = 90;
      buzz('notificationOccurred', 'success');
      return;
    }

    for (const b of this.enemyBullets)
      if (b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
        b.hit = true;
        lives--;
        updateHud();
        buzz('notificationOccurred', 'error');
        if (lives <= 0) { endGame(level); return; }
      }
    this.enemyBullets = this.enemyBullets.filter(b => !b.hit);
  },

  draw() {
    const s = this.ship;
    ctx.fillStyle = '#0f0';
    ctx.fillRect(s.x + 12, s.y, 8, 12);
    ctx.fillRect(s.x + 4, s.y + 12, 24, 8);
    ctx.fillRect(s.x, s.y + 16, 4, 8);
    ctx.fillRect(s.x + 28, s.y + 16, 4, 8);

    const colors = ['#f0f', '#f00', '#ff0', '#0ff'];
    for (const a of this.aliens) {
      if (!a.alive) continue;
      ctx.fillStyle = colors[a.type];
      ctx.fillRect(a.x + 4, a.y, 16, 6);
      ctx.fillRect(a.x, a.y + 6, 24, 6);
      ctx.fillRect(a.x + 2, a.y + 12, 4, 6);
      ctx.fillRect(a.x + 18, a.y + 12, 4, 6);
    }
    ctx.fillStyle = '#0f0';
    this.bullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 10));
    ctx.fillStyle = '#f00';
    this.enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 8));

    if (this.banner > 0) {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL ' + level, canvas.width / 2, canvas.height / 2);
      if (bannerMsg) {
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText(bannerMsg, canvas.width / 2, canvas.height / 2 + 30);
      }
      this.banner--;
      if (this.banner === 0) bannerMsg = '';
    }
  }
};

/* ============ SNAKE ============ */
const CELL = 20, GW = 16, GH = 20;
const snake = {
  title: '🐍 SNAKE', hint: '◀ ▶ turn left / right. Swipes and arrow keys work too.',
  showLevel: false, showLives: false, showFire: false,

  init() {
    this.body = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    this.dir = { x: 1, y: 0 };
    this.queue = [];
    this.step = 140;
    this.acc = 0;
    this.food = this.placeFood();
  },
  placeFood() {
    let p;
    do { p = { x: Math.floor(Math.random() * GW), y: Math.floor(Math.random() * GH) }; }
    while (this.body.some(s => s.x === p.x && s.y === p.y));
    return p;
  },
  lastDir() { return this.queue.length ? this.queue[this.queue.length - 1] : this.dir; },
  push(d) { if (this.queue.length < 2) this.queue.push(d); },
  setDir(x, y) {
    const b = this.lastDir();
    if ((x === b.x && y === b.y) || (x === -b.x && y === -b.y)) return;
    this.push({ x, y });
  },
  onPress(name) {
    const b = this.lastDir();
    if (name === 'left') this.push({ x: b.y, y: -b.x });
    if (name === 'right') this.push({ x: -b.y, y: b.x });
  },

  update(dt) {
    this.acc += Math.min(dt, 100);
    while (this.acc >= this.step) {
      this.acc -= this.step;
      if (this.queue.length) this.dir = this.queue.shift();
      const head = {
        x: (this.body[0].x + this.dir.x + GW) % GW,
        y: (this.body[0].y + this.dir.y + GH) % GH
      };
      const ate = head.x === this.food.x && head.y === this.food.y;
      const solid = ate ? this.body : this.body.slice(0, -1);
      if (solid.some(s => s.x === head.x && s.y === head.y)) { endGame(0); return; }
      this.body.unshift(head);
      if (ate) {
        score += 10;
        updateHud();
        buzz('impactOccurred', 'light');
        this.step = Math.max(70, this.step - 2);
        this.food = this.placeFood();
      } else {
        this.body.pop();
      }
    }
  },

  draw() {
    ctx.strokeStyle = '#062a10';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GW; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, GH * CELL); ctx.stroke(); }
    for (let i = 0; i <= GH; i++) { ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(GW * CELL, i * CELL); ctx.stroke(); }
    ctx.fillStyle = '#f00';
    ctx.fillRect(this.food.x * CELL + 3, this.food.y * CELL + 3, CELL - 6, CELL - 6);
    this.body.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#0f0' : '#0a0';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }
};

/* ============ BREAKOUT ============ */
const B_STEP = 1000 / 60;   // fixed 60 ticks per second on any screen
const breakout = {
  title: '🧱 BREAKOUT', hint: 'Hold ◀ ▶ or drag your finger to move the paddle.',
  showLevel: true, showLives: true, showFire: false,
  R: 4, BW: 34, BH: 14, GAP: 3, COLS: 8, TOP: 50, X0: 13,
  colors: ['#ff3b3b', '#ff8c3b', '#ffd83b', '#3bff5a', '#3bdcff', '#3b82ff', '#d93bff'],

  init() {
    this.paddle = { x: 132, y: 380, w: 56, h: 8 };
    this.acc = 0;
    this.banner = 0;
    this.startLevel();
  },
  startLevel() {
    this.speed = Math.min(3.2 + (level - 1) * 0.3, 6);
    const rows = Math.min(3 + level, 7);
    this.bricks = [];
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < this.COLS; c++)
        this.bricks.push({
          x: this.X0 + c * (this.BW + this.GAP),
          y: this.TOP + r * (this.BH + this.GAP),
          row: r, alive: true
        });
    this.resetBall();
  },
  resetBall() {
    const p = this.paddle;
    this.bx = p.x + p.w / 2;
    this.by = p.y - this.R;
    this.vx = 0;
    this.vy = 0;
    this.serve = 45;   // short pause before the ball launches
  },
  launch() {
    const a = (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.35);
    this.vx = this.speed * Math.sin(a);
    this.vy = -this.speed * Math.cos(a);
  },
  setSpeed(s) {
    const m = Math.hypot(this.vx, this.vy) || 1;
    this.vx *= s / m;
    this.vy *= s / m;
  },

  update(dt) {
    this.acc += Math.min(dt, 100);
    while (this.acc >= B_STEP) {
      this.acc -= B_STEP;
      this.tick();
      if (!running) return;
    }
  },

  tick() {
    const p = this.paddle, R = this.R;
    if (keys.left) p.x -= 5;
    if (keys.right) p.x += 5;
    p.x = Math.max(0, Math.min(canvas.width - p.w, p.x));

    if (this.serve > 0) {
      this.bx = p.x + p.w / 2;
      this.by = p.y - R;
      this.serve--;
      if (this.serve === 0) this.launch();
      return;
    }

    this.bx += this.vx;
    this.by += this.vy;

    // walls and ceiling
    if (this.bx - R < 0) { this.bx = R; this.vx = Math.abs(this.vx); }
    if (this.bx + R > canvas.width) { this.bx = canvas.width - R; this.vx = -Math.abs(this.vx); }
    if (this.by - R < 0) { this.by = R; this.vy = Math.abs(this.vy); }

    // ball lost
    if (this.by - R > canvas.height) {
      lives--;
      updateHud();
      buzz('notificationOccurred', 'error');
      if (lives <= 0) { endGame(level); return; }
      this.resetBall();
      return;
    }

    // paddle: where the ball lands sets the bounce angle
    if (this.vy > 0 && this.by + R >= p.y && this.by - R <= p.y + p.h &&
        this.bx >= p.x - R && this.bx <= p.x + p.w + R) {
      const hit = Math.max(-1, Math.min(1, (this.bx - (p.x + p.w / 2)) / (p.w / 2)));
      const a = hit * 1.05;   // up to about 60 degrees from vertical
      this.vx = this.speed * Math.sin(a);
      this.vy = -this.speed * Math.cos(a);
      this.by = p.y - R;
    }

    // bricks: at most one per tick
    for (const b of this.bricks) {
      if (!b.alive) continue;
      const nx = Math.max(b.x, Math.min(this.bx, b.x + this.BW));
      const ny = Math.max(b.y, Math.min(this.by, b.y + this.BH));
      if ((this.bx - nx) ** 2 + (this.by - ny) ** 2 > R * R) continue;
      b.alive = false;
      const ox = Math.min(this.bx + R - b.x, b.x + this.BW - (this.bx - R));
      const oy = Math.min(this.by + R - b.y, b.y + this.BH - (this.by - R));
      if (ox < oy) this.vx = -this.vx; else this.vy = -this.vy;
      score += (7 - b.row) * 10;
      updateHud();
      buzz('impactOccurred', 'light');
      this.speed = Math.min(this.speed + 0.03, 7);
      this.setSpeed(this.speed);
      break;
    }

    // level cleared
    if (this.bricks.every(b => !b.alive)) {
      score += 200 * level;   // level-clear bonus
      level++;
      if (lives < MAX_LIVES) { lives++; bannerMsg = "+1 LIFE"; }
      updateHud();
      this.startLevel();
      this.banner = 90;
      buzz('notificationOccurred', 'success');
    }
  },

  draw() {
    for (const b of this.bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = this.colors[b.row];
      ctx.fillRect(b.x, b.y, this.BW, this.BH);
    }
    const p = this.paddle;
    ctx.fillStyle = '#0f0';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.bx, this.by, this.R, 0, Math.PI * 2);
    ctx.fill();

    if (this.banner > 0) {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL ' + level, canvas.width / 2, canvas.height / 2 + 60);
      if (bannerMsg) {
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText(bannerMsg, canvas.width / 2, canvas.height / 2 + 90);
      }
      this.banner--;
      if (this.banner === 0) bannerMsg = '';
    }
  }
};

/* ============ PONG ============ */
const pong = {
  title: '🏓 PONG', hint: 'Beat the CPU paddle. Hold ◀ ▶ or drag your finger.',
  showLevel: true, showLives: true, showFire: false,
  R: 5, WIN: 5,   // ball radius, points needed to clear a level

  init() {
    this.paddle = { x: 132, y: 380, w: 56, h: 8 };
    this.cpu = { x: 132, y: 12, w: 56, h: 8 };
    this.acc = 0;
    this.banner = 0;
    this.lvlPoints = 0;
    this.aim = 0;
    this.setLevel();
    this.serveBall(1);
  },
  setLevel() {
    this.base = Math.min(3.2 + (level - 1) * 0.35, 6);
    this.cpuSpeed = Math.min(1.8 + (level - 1) * 0.35, 4.6);
  },
  serveBall(dir) {
    this.bx = canvas.width / 2;
    this.by = canvas.height / 2;
    this.vx = 0;
    this.vy = 0;
    this.speed = this.base;
    this.serveDir = dir;   // 1 = toward you, -1 = toward the CPU
    this.serve = 45;       // short pause before the ball launches
  },
  launch() {
    const a = (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.4);
    this.vx = this.speed * Math.sin(a);
    this.vy = this.serveDir * this.speed * Math.cos(a);
  },

  update(dt) {
    this.acc += Math.min(dt, 100);
    while (this.acc >= B_STEP) {
      this.acc -= B_STEP;
      this.tick();
      if (!running) return;
    }
  },

  tick() {
    const p = this.paddle, c = this.cpu, R = this.R;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    // your paddle
    if (keys.left) p.x -= 5;
    if (keys.right) p.x += 5;
    p.x = clamp(p.x, 0, canvas.width - p.w);

    // CPU paddle: chases the ball with a capped speed and a small aiming error
    const target = (this.vy < 0 ? this.bx - this.aim : canvas.width / 2) - c.w / 2;
    c.x += clamp(target - c.x, -this.cpuSpeed, this.cpuSpeed);
    c.x = clamp(c.x, 0, canvas.width - c.w);

    if (this.serve > 0) {
      this.serve--;
      if (this.serve === 0) this.launch();
      return;
    }

    this.bx += this.vx;
    this.by += this.vy;

    // side walls
    if (this.bx - R < 0) { this.bx = R; this.vx = Math.abs(this.vx); }
    if (this.bx + R > canvas.width) { this.bx = canvas.width - R; this.vx = -Math.abs(this.vx); }

    // your paddle: where the ball lands sets the bounce angle
    if (this.vy > 0 && this.by + R >= p.y && this.by - R <= p.y + p.h &&
        this.bx >= p.x - R && this.bx <= p.x + p.w + R) {
      const hit = clamp((this.bx - (p.x + p.w / 2)) / (p.w / 2), -1, 1);
      const a = hit * 1.05;
      this.speed = Math.min(this.speed + 0.15, this.base + 2);
      this.vx = this.speed * Math.sin(a);
      this.vy = -this.speed * Math.cos(a);
      this.by = p.y - R;
      this.aim = (Math.random() * 2 - 1) * c.w * 0.4;   // new CPU aiming error
      buzz('impactOccurred', 'light');
    }

    // CPU paddle
    if (this.vy < 0 && this.by - R <= c.y + c.h && this.by + R >= c.y &&
        this.bx >= c.x - R && this.bx <= c.x + c.w + R) {
      const hit = clamp((this.bx - (c.x + c.w / 2)) / (c.w / 2), -1, 1);
      const a = hit * 1.05;
      this.vx = this.speed * Math.sin(a);
      this.vy = this.speed * Math.cos(a);
      this.by = c.y + c.h + R;
    }

    // ball got past you: lose a life
    if (this.by - R > canvas.height) {
      lives--;
      updateHud();
      buzz('notificationOccurred', 'error');
      if (lives <= 0) { endGame(level); return; }
      this.serveBall(-1);
      return;
    }

    // ball got past the CPU: you score
    if (this.by + R < 0) {
      score += 10 * level;
      this.lvlPoints++;
      if (this.lvlPoints >= this.WIN) {
        score += 50 * level;   // level-clear bonus
        level++;
        this.lvlPoints = 0;
        if (lives < MAX_LIVES) { lives++; bannerMsg = "+1 LIFE"; }
        this.setLevel();
        this.banner = 90;
        buzz('notificationOccurred', 'success');
      }
      updateHud();
      this.serveBall(1);
    }
  },

  draw() {
    // center line
    ctx.fillStyle = '#063a14';
    for (let x = 0; x < canvas.width; x += 20) ctx.fillRect(x, canvas.height / 2 - 1, 10, 2);

    const p = this.paddle, c = this.cpu;
    ctx.fillStyle = '#0f0';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#f33';
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.bx, this.by, this.R, 0, Math.PI * 2);
    ctx.fill();

    // points toward the next level
    ctx.fillStyle = '#0a0';
    ctx.font = '14px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(this.lvlPoints + ' / ' + this.WIN, 8, canvas.height / 2 - 8);

    if (this.banner > 0) {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL ' + level, canvas.width / 2, canvas.height / 2 + 60);
      if (bannerMsg) {
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText(bannerMsg, canvas.width / 2, canvas.height / 2 + 90);
      }
      this.banner--;
      if (this.banner === 0) bannerMsg = '';
    }
  }
};
 
/* ============ GALAGA ============ */
const galaga = {
  title: '👾 GALAGA', hint: 'Hold 🔥 to fire. Dive-bombing enemies can be rescued.',
  showLevel: true, showLives: true, showFire: true,

  STEP: 1000 / 60,  // fixed 60fps logic rate
  acc: 0,
  init() {
    this.ship = { x: 144, y: 360, w: 32, h: 24, speed: 3 };
    this.canFire = true;
    this.banner = 0;
    this.wingmen = 0;   // 0, 1, or 2 wingmen
    this.startLevel();
  },
  startLevel() {
    this.dir = 1;
    this.speed = 0.3 + Math.min(level - 1, 10) * 0.1;
    this.bullets = [];
    this.enemyBullets = [];
    this.aliens = [];
    this.divers = [];   // dive-bombing enemies
    this.captives = []; // enemies that captured a life
    const top = 40 + Math.min(level - 1, 5) * 8;
    for (let r = 0; r < 4; r++)
      for (let c = 0; c < 8; c++)
        this.aliens.push({ x: 30 + c * 35, y: top + r * 30, w: 24, h: 18, alive: true, type: r, ox: 30 + c * 35, oy: top + r * 30 });
    this.formTime = 0;
  },
  shoot() {
    if (!running || !this.canFire) return;
    // Your ship fires
    this.bullets.push({ x: this.ship.x + this.ship.w / 2, y: this.ship.y });
    // Wingmen fire too
    for (let i = 0; i < this.wingmen; i++) {
      const wx = i === 0 ? this.ship.x - 20 : this.ship.x + this.ship.w + 20;
      this.bullets.push({ x: wx, y: this.ship.y + 10 });
    }
    this.canFire = false;
    setTimeout(() => { this.canFire = true; }, 250);
  },
  onPress(name) { if (name === 'fire') this.shoot(); },

  update(dt) {
    this.acc += Math.min(dt, 100);
    while (this.acc >= this.STEP) {
      this.acc -= this.STEP;
      this.tick();
      if (!running) return;
    }
  },
  
  tick() {
    const s = this.ship;
    if (keys.fire) this.shoot();
    if (keys.left && s.x > 0) s.x -= s.speed;
    if (keys.right && s.x < canvas.width - s.w) s.x += s.speed;

    this.bullets = this.bullets.filter(b => (b.y -= 6) > 0);
    this.enemyBullets = this.enemyBullets.filter(b => (b.y += 4) < canvas.height);

    // Formation movement
    let hitEdge = false;
    let anyAlive = false;
    for (const a of this.aliens) {
      if (!a.alive) continue;
      anyAlive = true;
      a.x += this.dir * this.speed;
      if (a.x <= 5 || a.x >= canvas.width - a.w - 5) hitEdge = true;
    }
    // Only move formation if there are alive enemies
    if (anyAlive && hitEdge) {
      this.dir *= -1;
      this.aliens.forEach(a => { if (a.alive) a.y += 15; });
      this.speed += 0.05;
    }

    // Dive bombing
    // Spawn divers less often, max 1 at a time
    if (Math.random() < 0.005 && this.divers.length < 1 && 
        this.aliens.filter(a => a.alive).length > 0) {
      const alive = this.aliens.filter(a => a.alive);
      const a = alive[Math.floor(Math.random() * alive.length)];
      // Save original position before leaving formation
      this.divers.push({ 
        x: a.x, 
        y: a.y, 
        ox: a.x, 
        oy: a.y,
        tx: s.x, 
        ty: s.y, 
        w: a.w, 
        h: a.h, 
        alive: true, 
        type: a.type, 
        t: 0 
      });
      a.alive = false; // temporarily leave formation
    }

    // Update divers (slower, smoother)
    for (const d of this.divers) {
      if (!d.alive) continue;
      
      // Slower progression: 0.005 = ~3.3 seconds per dive
      d.t += 0.005;
      
      // Bezier curve toward player with wider arc
      const p0 = { x: d.ox, y: d.oy };
      const p1 = { x: d.tx, y: Math.max(d.ty + 150, d.oy + 50) }; // wider arc
      const p2 = { x: d.tx, y: d.ty };
      const t = Math.min(d.t, 1), mt = 1 - t;
      
      // Smooth easing
      const ease = t * t * (3 - 2 * t); // smoothstep
      const ex = mt * mt * p0.x + 2 * mt * t * p1.x + t * t * p2.x;
      const ey = mt * mt * p0.y + 2 * mt * t * p1.y + t * t * p2.y;
      
      // Interpolate with easing for smoother motion
      d.x += (ex - d.x) * 0.15;
      d.y += (ey - d.y) * 0.15;

      // Hit player
      if (d.x > s.x && d.x < s.x + s.w && d.y > s.y && d.y < s.y + s.h) {
        d.alive = false;
        lives--;
        this.wingmen = 0; // lose wingmen on hit
        updateHud();
        buzz('notificationOccurred', 'error');
        if (lives <= 0) { endGame(level); return; }
        // Become captive
        this.captives.push({ x: d.x, y: d.y, w: d.w, h: d.h, alive: true, type: d.type });
      }

      // Return to formation
      if (d.t >= 1) {
        d.alive = false;
        // Find empty slot closest to where we started
        let closest = null, bestDist = Infinity;
        for (const a of this.aliens) {
          if (!a.alive) {
            const dist = Math.abs(a.ox - d.ox) + Math.abs(a.oy - d.oy);
            if (dist < bestDist) {
              bestDist = dist;
              closest = a;
            }
          }
        }
        if (closest) {
          closest.alive = true;
          closest.x = closest.ox;
          closest.y = closest.oy;
        }
      }
    }
    this.divers = this.divers.filter(d => d.alive);

    // Update captives (float downward slowly)
    for (const c of this.captives) {
      if (!c.alive) continue;
      c.y += 1;
      if (c.y > canvas.height) c.alive = false;
    }
    this.captives = this.captives.filter(c => c.alive);

    // Your bullets hit aliens
    for (const b of this.bullets)
      for (const a of this.aliens)
        if (a.alive && b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
          a.alive = false; b.hit = true;
          score += (4 - a.type) * 10;
          updateHud();
          buzz('impactOccurred', 'light');
        }
    this.bullets = this.bullets.filter(b => !b.hit);

    // Your bullets hit divers (worth more)
    for (const b of this.bullets)
      for (const d of this.divers)
        if (d.alive && b.x > d.x && b.x < d.x + d.w && b.y > d.y && b.y < d.y + d.h) {
          d.alive = false; b.hit = true;
          score += (4 - d.type) * 20; // double points for dive bombers
          updateHud();
          buzz('impactOccurred', 'light');
        }
    this.bullets = this.bullets.filter(b => !b.hit);

    // Your bullets hit captives (rescue - becomes wingman)
    for (const b of this.bullets)
      for (const c of this.captives)
        if (c.alive && b.x > c.x && b.x < c.x + c.w && b.y > c.y && b.y < c.y + c.h) {
          c.alive = false; b.hit = true;
          score += 500; // rescue bonus
          this.wingmen = Math.min(this.wingmen + 1, 2);
          updateHud();
          buzz('notificationOccurred', 'success');
        }
    this.bullets = this.bullets.filter(b => !b.hit);

    // Enemy bullets (less frequent)
    const alive = this.aliens.filter(a => a.alive);
    const chance = Math.min(0.012 + (level - 1) * 0.003, 0.035);
    if (alive.length && Math.random() < chance) {
      const a = alive[Math.floor(Math.random() * alive.length)];
      this.enemyBullets.push({ x: a.x + a.w / 2, y: a.y + a.h });
    }

    for (const b of this.enemyBullets)
      if (b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
        b.hit = true;
        lives--;
        this.wingmen = 0; // lose wingmen on hit
        updateHud();
        buzz('notificationOccurred', 'error');
        if (lives <= 0) { endGame(level); return; }
      }
    this.enemyBullets = this.enemyBullets.filter(b => !b.hit);

    // Level clear
    if (this.aliens.every(a => !a.alive) && this.divers.length === 0) {
      score += 100 * level;
      level++;
      if (lives < MAX_LIVES) { lives++; bannerMsg = "+1 LIFE"; }
      updateHud();
      this.startLevel();
      this.banner = 90;
      buzz('notificationOccurred', 'success');
      return;
    }
  },

  draw() {
    const s = this.ship;
    
    // Draw wingmen first (behind player)
    for (let i = 0; i < this.wingmen; i++) {
      const wx = i === 0 ? s.x - 24 : s.x + s.w + 8;
      this.drawPlayerShip(wx, s.y - 4, 0.7, true);
    }
    
    // Draw player ship (classic Galaga fighter)
    this.drawPlayerShip(s.x, s.y, 1, false);

    // Draw formation enemies (narrow wings, two-pose flap)
    for (const a of this.aliens) {
      if (!a.alive) continue;
      this.drawFormationEnemy(a.x, a.y, a.w, a.h, a.type);
    }

    // Draw divers (spread wings, fast flutter)
    const diveFlutter = Math.sin(Date.now() / 60) * 0.3;
    for (const d of this.divers) {
      if (!d.alive) continue;
      this.drawEnemy(d.x, d.y, d.w, d.h, d.type, diveFlutter, true);
    }

    // Draw captives (trapped in rescue pod)
    for (const c of this.captives) {
      this.drawCaptive(c.x, c.y, c.w, c.h, c.type);
    }

    // Bullets
    ctx.fillStyle = '#0f0';
    this.bullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = '#f00';
    this.enemyBullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
      ctx.fill();
    });

    // Level banner
    if (this.banner > 0) {
      ctx.fillStyle = '#0f0';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL ' + level, canvas.width / 2, canvas.height / 2);
      if (bannerMsg) {
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText(bannerMsg, canvas.width / 2, canvas.height / 2 + 30);
      }
      this.banner--;
      if (this.banner === 0) bannerMsg = '';
    }
  },

  // Galaga-style player ship
  drawPlayerShip(x, y, scale, isWingman) {
    const w = 32 * scale, h = 24 * scale;
    const cx = x + w/2, cy = y + h/2;
    
    // Main body (teardrop/chevron shape)
    ctx.fillStyle = isWingman ? '#0a0' : '#0f0';
    ctx.beginPath();
    ctx.moveTo(cx, cy - h*0.6);      // nose
    ctx.lineTo(x + w*0.9, cy + h*0.3); // right wing
    ctx.lineTo(cx, cy + h*0.1);      // body indent
    ctx.lineTo(x + w*0.1, cy + h*0.3); // left wing
    ctx.closePath();
    ctx.fill();
    
    // Cockpit (blue dome)
    ctx.fillStyle = isWingman ? '#008' : '#00f';
    ctx.beginPath();
    ctx.arc(cx, cy - h*0.1, w*0.15, 0, Math.PI * 2);
    ctx.fill();
    
    // Engine exhaust (pulsing for wingmen)
    if (isWingman) {
      const pulse = 0.5 + Math.sin(Date.now() / 100) * 0.3;
      ctx.fillStyle = `rgba(0, 255, 255, ${pulse})`;
      ctx.fillRect(cx - w*0.1, y + h*0.4, w*0.2, h*0.3 * pulse);
    }
  },

  // Galaga-style enemy (bee/bug shape with tuckable wings)
  drawEnemy(x, y, w, h, type, wingFlap, isDiving) {
    const colors = ['#f0f', '#f00', '#ff0', '#0ff'];
    const bodyColor = colors[type];
    const cx = x + w/2, cy = y + h/2;
    
    // Wing state: 0 = tucked (formation), 1 = spread (diving)
    // For divers, wingFlap is the spread amount plus flutter
    // For formation, wings are mostly tucked with slight breathing motion
    const spread = isDiving ? 0.8 + wingFlap * 0.2 : 0.15 + Math.sin(Date.now() / 400) * 0.05;
    
    // Wing angle: tucked back = narrow V, spread = wide V
    const wingAngle = spread * Math.PI * 0.4; // 0 to ~72 degrees
    
    // Draw wings first (behind body)
    ctx.fillStyle = bodyColor;
    
    // Left wing
    ctx.beginPath();
    ctx.moveTo(cx, cy - h*0.1); // shoulder
    ctx.lineTo(
      cx - Math.cos(wingAngle) * w*0.7,
      cy - Math.sin(wingAngle) * h*0.8 * spread
    ); // left tip
    ctx.lineTo(cx - w*0.05, cy + h*0.3); // body join
    ctx.closePath();
    ctx.fill();
    
    // Right wing
    ctx.beginPath();
    ctx.moveTo(cx, cy - h*0.1); // shoulder
    ctx.lineTo(
      cx + Math.cos(wingAngle) * w*0.7,
      cy - Math.sin(wingAngle) * h*0.8 * spread
    ); // right tip
    ctx.lineTo(cx + w*0.05, cy + h*0.3); // body join
    ctx.closePath();
    ctx.fill();
    
    // Wing veins (visible when spread, fade when tucked)
    if (spread > 0.3) {
      ctx.strokeStyle = `rgba(0,0,0,${spread * 0.5})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, cy - h*0.1);
      ctx.lineTo(
        cx - Math.cos(wingAngle * 0.7) * w*0.5,
        cy - Math.sin(wingAngle * 0.7) * h*0.5
      );
      ctx.moveTo(cx, cy - h*0.1);
      ctx.lineTo(
        cx + Math.cos(wingAngle * 0.7) * w*0.5,
        cy - Math.sin(wingAngle * 0.7) * h*0.5
      );
      ctx.stroke();
    }
    
    // Body (rounded segment, more visible when wings tucked)
    ctx.fillStyle = spread < 0.4 ? bodyColor : '#fff';
    ctx.beginPath();
    ctx.ellipse(cx, cy + h*0.1, w*0.18, h*0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Head/eyes (colored dome)
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.arc(cx, cy - h*0.3, w*0.18, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyes (white dots, glow when diving)
    ctx.fillStyle = isDiving ? '#ff0' : '#fff';
    ctx.beginPath();
    ctx.arc(cx - w*0.06, cy - h*0.35, w*0.05, 0, Math.PI * 2);
    ctx.arc(cx + w*0.06, cy - h*0.35, w*0.05, 0, Math.PI * 2);
    ctx.fill();
    
    // Antennae for diving enemies (waving)
    if (isDiving) {
      const wave = Math.sin(Date.now() / 50) * 0.3;
      ctx.strokeStyle = bodyColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - w*0.1, cy - h*0.45);
      ctx.quadraticCurveTo(cx - w*0.3 + wave*10, cy - h*0.9, cx - w*0.15, cy - h*1.1);
      ctx.moveTo(cx + w*0.1, cy - h*0.45);
      ctx.quadraticCurveTo(cx + w*0.3 + wave*10, cy - h*0.9, cx + w*0.15, cy - h*1.1);
      ctx.stroke();
    }
    
    // Engine glow for divers (pulsing from rear)
    if (isDiving) {
      const pulse = 0.6 + Math.sin(Date.now() / 80) * 0.4;
      ctx.fillStyle = `rgba(255, 100, 50, ${pulse})`;
      ctx.beginPath();
      ctx.moveTo(cx - w*0.1, y + h*0.5);
      ctx.lineTo(cx + w*0.1, y + h*0.5);
      ctx.lineTo(cx, y + h*(0.8 + pulse * 0.3));
      ctx.closePath();
      ctx.fill();
    }
  },
  
  // Formation enemy: narrower wings so neighbors don't touch, two-pose flap
  drawFormationEnemy(x, y, w, h, type) {
    const colors = ['#f0f', '#f00', '#ff0', '#0ff'];
    const col = colors[type];
    const cx = x + w / 2, cy = y + h / 2;
    const up = Math.floor(Date.now() / 450) % 2 === 0;   // snaps between two poses
    const tipY = cy + h * (up ? -0.3 : 0.3);

    // wings (drawn first, behind the body)
    ctx.fillStyle = col;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + side * w * 0.1, cy - h * 0.15);   // shoulder
      ctx.lineTo(cx + side * w * 0.62, tipY);           // wing tip
      ctx.lineTo(cx + side * w * 0.12, cy + h * 0.35);  // rear join
      ctx.closePath();
      ctx.fill();
    }

    // body
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(cx, cy + h * 0.1, w * 0.2, h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    // head
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(cx, cy - h * 0.25, w * 0.15, 0, Math.PI * 2);
    ctx.fill();

    // eyes
    ctx.fillStyle = '#fff';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + side * w * 0.05, cy - h * 0.3, w * 0.04, 0, Math.PI * 2);
      ctx.fill();
    }
  },  

  // Captive ship (trapped in rescue pod)
  drawCaptive(x, y, w, h, type) {
    const cx = x + w/2, cy = y + h/2;
    
    // Rescue pod (transparent green sphere)
    ctx.fillStyle = 'rgba(0, 255, 100, 0.3)';
    ctx.strokeStyle = '#0f0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, w*0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    
    // Trapped ship inside
    this.drawEnemy(x + w*0.1, y + h*0.1, w*0.8, h*0.8, type, 0, false);
    
    // "RESCUE" pulsing text
    const pulse = 0.5 + Math.sin(Date.now() / 200) * 0.5;
    ctx.fillStyle = `rgba(255, 255, 0, ${pulse})`;
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('RESCUE', cx, cy + h*0.8);
  }
};
 
/* ============ SHARED GAME FLOW ============ */
const GAMES = { invaders, snake, breakout, pong, galaga };

function openGame(key) {
  currentKey = key;
  current = GAMES[key];
  $('startTitle').textContent = current.title;
  $('startHint').textContent = current.hint;
  hide('menuScreen'); hide('gameOverScreen');
  show('startScreen');
}

function startGame() {
  score = 0; lives = 3; level = 1; bannerMsg = '';
  $('midStat').style.visibility = current.showLevel ? 'visible' : 'hidden';
  $('livesStat').style.visibility = current.showLives ? 'visible' : 'hidden';
  $('fireBtn').style.visibility = current.showFire ? 'visible' : 'hidden';
  setControlsVisible(true);
  Object.keys(keys).forEach(k => { keys[k] = false; });
  hide('startScreen'); hide('gameOverScreen');
  current.init();
  updateHud();
  running = true;
  lastT = performance.now();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function loop(t) {
  if (!running) return;
  const dt = t - lastT;
  lastT = t;
  current.update(dt);
  if (!running) return;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  current.draw();
  raf = requestAnimationFrame(loop);
}

function endGame(levelReached) {
  if (!running) return;
  running = false;
  setControlsVisible(true);
  cancelAnimationFrame(raf);
  Object.keys(keys).forEach(k => { keys[k] = false; });
  $('finalScore').textContent = score;
  $('extraLine').style.display = levelReached ? '' : 'none';
  if (levelReached) $('finalLevel').textContent = levelReached;
  show('gameOverScreen');
}

function toMenu() {
  running = false;
  setControlsVisible(true);
  cancelAnimationFrame(raf);
  hide('startScreen'); hide('gameOverScreen');
  show('menuScreen');
}

/* ============ INPUT ============ */
function bindButton(id, name) {
  const el = $(id);
  const on = e => { e.preventDefault(); keys[name] = true; if (running && current.onPress) current.onPress(name); };
  const off = e => { e.preventDefault(); keys[name] = false; };
  el.addEventListener('touchstart', on);
  el.addEventListener('touchend', off);
  el.addEventListener('touchcancel', off);
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindButton('leftBtn', 'left');
bindButton('rightBtn', 'right');
bindButton('fireBtn', 'fire');

document.addEventListener('keydown', e => {
  if (!running) return;
  if (e.key === 'ArrowLeft') { keys.left = true; if (current === snake) snake.setDir(-1, 0); }
  if (e.key === 'ArrowRight') { keys.right = true; if (current === snake) snake.setDir(1, 0); }
  if (e.key === 'ArrowUp') { if (current === snake) snake.setDir(0, -1); else keys.fire = true; e.preventDefault(); }
  if (e.key === 'ArrowDown') { if (current === snake) snake.setDir(0, 1); e.preventDefault(); }
  if (e.key === ' ') { keys.fire = true; e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
  if (e.key === ' ' || e.key === 'ArrowUp') keys.fire = false;
});

// Swipes for Snake (work anywhere on the screen)
let tx = 0, ty = 0;
document.addEventListener('touchstart', e => {
  if (e.target.closest('.btn')) return;
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
});
document.addEventListener('touchend', e => {
  if (!running || current !== snake || e.target.closest('.btn')) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) snake.setDir(dx > 0 ? 1 : -1, 0);
  else snake.setDir(0, dy > 0 ? 1 : -1);
});

/* ============ COLLAPSE / RESTORE ============ */
const collapseBtn = $('collapseBtn');
const controls = $('controls');
let controlsHidden = false, holdTimer = null;

function setControlsVisible(show) {
  controlsHidden = !show;
  controls.style.display = show ? 'flex' : 'none';
  collapseBtn.classList.toggle('collapsed', !show);
  if (!show) keys.left = keys.right = keys.fire = false;   // don't leave a button stuck on
}

function tabDown(e) {
  e.preventDefault();
  e.stopPropagation();   // keeps the paddle drag and snake swipe from starting here
  if (controlsHidden) holdTimer = setTimeout(() => setControlsVisible(true), 500);
  else setControlsVisible(false);
}
function tabUp(e) { e.stopPropagation(); clearTimeout(holdTimer); }

collapseBtn.addEventListener('touchstart', tabDown, { passive: false });
collapseBtn.addEventListener('touchend', tabUp);
collapseBtn.addEventListener('touchcancel', tabUp);
collapseBtn.addEventListener('mousedown', tabDown);
collapseBtn.addEventListener('mouseup', tabUp);
collapseBtn.addEventListener('mouseleave', tabUp);

// Drag anywhere on screen to move the paddle (Breakout and Pong).
// Relative: the paddle follows how far your finger moves, not where it is.
const DRAG_GAIN = 1.5;   // paddle movement per finger movement; raise for more sensitivity
let dragId = null, dragX = 0;
const paddleGame = () => running && (current === breakout || current === pong);

document.addEventListener('touchstart', e => {
  if (!paddleGame() || dragId !== null || e.target.closest('.btn')) return;
  const t = e.changedTouches[0];
  dragId = t.identifier;
  dragX = t.clientX;
});

document.addEventListener('touchmove', e => {
  if (dragId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier !== dragId) continue;
    e.preventDefault();
    if (!paddleGame()) { dragId = null; return; }
    const scale = canvas.width / canvas.clientWidth;
    const p = current.paddle;
    p.x += (t.clientX - dragX) * scale * DRAG_GAIN;
    p.x = Math.max(0, Math.min(canvas.width - p.w, p.x));
    dragX = t.clientX;
  }
}, { passive: false });

function endDrag(e) {
  for (const t of e.changedTouches) if (t.identifier === dragId) dragId = null;
}
document.addEventListener('touchend', endDrag);
document.addEventListener('touchcancel', endDrag);
 
/* ============ MENU BUTTONS ============ */
document.querySelectorAll('.menuBtn').forEach(b => { b.onclick = () => openGame(b.dataset.game); });
$('startBtn').onclick = startGame;
$('restartBtn').onclick = startGame;
$('backBtn').onclick = toMenu;
$('menuBtn').onclick = toMenu;
// sendData closes the Mini App, so it only runs on an explicit tap
$('submitBtn').onclick = () => {
  const payload = JSON.stringify({ game: currentKey, score, level });
  if (tg) tg.sendData(payload); else alert('Open from Telegram to submit: ' + payload);
};
 // Jump straight into a game when the URL has ?game=name
const wanted = new URLSearchParams(location.search).get('game');
if (wanted && GAMES[wanted]) openGame(wanted);
</script>
